name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify durable org-lock SQL without external credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/lock-tests" --ignore-scripts --no-audit @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/lock-tests/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-target-locks.mjs
