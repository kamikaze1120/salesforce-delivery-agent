name: Security scanner integration
on:
  pull_request:
    paths:
      - 'runner/**'
      - 'scripts/verify-security.mjs'
      - '.github/workflows/security-integration.yml'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'scripts/verify-security.mjs'
      - '.github/workflows/security-integration.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  real-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts @salesforce/cli@2.153.5
      - name: Scan clean and unsafe synthetic Apex with the real plugin
        run: node scripts/verify-security.mjs
        env:
          CODE_ANALYZER_VERSION: '5.16.0'
