name: Salesforce setup verification
run-name: Read-only setup ${{ inputs.stage }}
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Non-production environment to inspect (no deployment)
        type: choice
        required: true
        options: [dev, qa, uat]
permissions:
  contents: read
concurrency:
  group: setup-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install application dependencies without credentials
        run: npm ci --ignore-scripts
      - name: Check configuration before tool installation
        run: node runner/setup.mjs --config-only
        env:
          DELIVERY_STAGE: ${{ inputs.stage }}
          DELIVERY_SETUP_TARGETS: ${{ vars.DELIVERY_SETUP_TARGETS }}
          SALESFORCE_CLI_VERSION: ${{ vars.SALESFORCE_CLI_VERSION }}
          PLAYWRIGHT_VERSION: ${{ vars.PLAYWRIGHT_VERSION }}
          CODE_ANALYZER_VERSION: ${{ vars.CODE_ANALYZER_VERSION }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
      - name: Install reviewed tooling without credentials
        run: node runner/install.mjs
        env:
          SALESFORCE_CLI_VERSION: ${{ vars.SALESFORCE_CLI_VERSION }}
          PLAYWRIGHT_VERSION: ${{ vars.PLAYWRIGHT_VERSION }}
          CODE_ANALYZER_VERSION: ${{ vars.CODE_ANALYZER_VERSION }}
      - name: Verify JWT and read org identity through restricted MCP
        run: PATH="$PWD/node_modules/.bin:$PATH" node runner/setup.mjs
        env:
          DELIVERY_STAGE: ${{ inputs.stage }}
          DELIVERY_SETUP_TARGETS: ${{ vars.DELIVERY_SETUP_TARGETS }}
          SALESFORCE_CLI_VERSION: ${{ vars.SALESFORCE_CLI_VERSION }}
          PLAYWRIGHT_VERSION: ${{ vars.PLAYWRIGHT_VERSION }}
          CODE_ANALYZER_VERSION: ${{ vars.CODE_ANALYZER_VERSION }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
