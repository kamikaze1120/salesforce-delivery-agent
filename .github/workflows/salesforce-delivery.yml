          DELIVERY_WORKSPACE: ${{ inputs.workspace_id }}
          DELIVERY_JOB: ${{ inputs.delivery_id }}
          DELIVERY_PIPELINE: ${{ inputs.pipeline_id }}
          DELIVERY_STAGE: ${{ fromJSON(inputs.stage_order)[4] }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
